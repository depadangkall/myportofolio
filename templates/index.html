<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{ short_name }}</a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_education' %}">Education</a>
                <a href="{% url 'main:show_moments' %}">Moments</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker reveal reveal-1">
                        Information System &middot; Universitas Indonesia
                    </p>
                    <h1 class="reveal reveal-2">{{ name }}</h1>
                    <div class="accent-bar reveal reveal-3"></div>
                </div>
                <div class="hero-photo reveal reveal-2" id="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="/static/img/foto-baru2.jpeg" alt="Photo of {{name}} ">
                </div>
                <div class="hero-details">
                    <p class="bio reveal reveal-3">{{ bio }}</p>
                    <dl class="meta-list reveal reveal-4">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>
                    <div class="social-links reveal reveal-5">
                        <a href="mailto:devadattadarmaputra@gmail.com" class="social-link social-link-primary">
                            <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                            Email
                        </a>
                        <a href="https://github.com/depadangkall" class="social-link">
                            <svg class="social-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
                            GitHub
                        </a>
                        <a href="https://www.linkedin.com/in/igededevadatta" class="social-link">
                            <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 11.02-4.12 2.06 2.06 0 01-.02 4.12zM7.12 20.45H3.56V9h3.56v11.45z"></path></svg>
                            LinkedIn
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-grid">
            <p class="footer-copy">&copy; 2026 {{short_name}}. Faculty of Computer Science, Universitas Indonesia.</p>
            <a href="#profile" class="back-to-top">Back to top &uarr;</a>
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var photo = document.getElementById("hero-photo");
            if (photo && window.matchMedia("(hover: hover)").matches) {
                photo.addEventListener("mousemove", function (e) {
                    var rect = photo.getBoundingClientRect();
                    var x = (e.clientX - rect.left) / rect.width - 0.5;
                    var y = (e.clientY - rect.top) / rect.height - 0.5;
                    photo.style.transform = "perspective(700px) rotateY(" + (x * 14) + "deg) rotateX(" + (y * -14) + "deg)";
                });

                photo.addEventListener("mouseleave", function () {
                    photo.style.transform = "perspective(700px) rotateY(0deg) rotateX(0deg)";
                });
            }
        });
    </script>
</body>
</html>
