<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_education' %}">Education</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Information System &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                    <div class="accent-bar"></div>
                </div>
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="/static/img/foto-baru.png" alt="Photo of {{name}} ">
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="mailto:devadattadarmaputra@gmail.com" class="social-link social-link-primary">Email Me</a>
                        <a href="https://github.com/depadangkall" class="social-link">GitHub</a>
                        <a href="https://www.linkedin.com/in/igededevadatta" class="social-link">LinkedIn</a>
                    </div>
                </div>
            </div>
        </section>

        <section class="moments" id="moments">
            <div class="container">
                <h2 class="section-title">Moments</h2>
                <p class="section-subtitle"></p>

                <div class="moments-track-wrap">
                    <div class="moments-track">
                        <figure class="moments-item">
                            <img src="/static/img/welcomingstaffoh.jpeg" alt="">
                        </figure>

                        <figure class="moments-item">
                            <img src="/static/img/paradeui.jpeg" alt="">
                        </figure>

                        <figure class="moments-item">
                            <img src="/static/img/keilmuan.jpeg" alt="">
                        </figure>

                        <figure class="moments-item">
                            <img src="/static/img/bingkai.jpeg" alt="">
                        </figure>

                        <figure class="moments-item">
                            <img src="/static/img/bisdevddp0.png" alt="">
                        </figure>

                        <figure class="moments-item">
                            <img src="/static/img/kmhduwiwipb.png" alt="">
                        </figure>

                        <figure class="moments-item" aria-hidden="true">
                            <img src="/static/img/welcomingstaffoh.jpeg" alt="">
                        </figure>

                        <figure class="moments-item" aria-hidden="true">
                            <img src="/static/img/paradeui.jpeg" alt="">
                        </figure>

                        <figure class="moments-item" aria-hidden="true">
                            <img src="/static/img/keilmuan.jpeg" alt="">
                        </figure>

                        <figure class="moments-item" aria-hidden="true">
                            <img src="/static/img/bingkai.jpeg" alt="">
                        </figure>

                        <figure class="moments-item" aria-hidden="true">
                            <img src="/static/img/bisdevddp0.png" alt="">
                        </figure>

                        <figure class="moments-item" aria-hidden="true">
                            <img src="/static/img/kmhduwiwipb.png" alt="">
                        </figure>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-grid">
            <p class="footer-copy">&copy; 2026 {{name}}. Faculty of Computer Science, Universitas Indonesia.</p>
            <a href="#profile" class="back-to-top">Back to top &uarr;</a>
        </div>
    </footer>
</body>
</html>
