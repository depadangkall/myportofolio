<div id="skill-modal"
     class="experience-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="skill-modal-title">
    <button type="button"
            class="experience-form-modal__backdrop"
            popovertarget="skill-modal"
            popovertargetaction="hide"
            aria-label="Close skill form"></button>

    <div class="experience-form-modal__content">
        <button type="button"
                class="experience-form-modal__close"
                popovertarget="skill-modal"
                popovertargetaction="hide"
                aria-label="Close skill form">×</button>

        <h2 id="skill-modal-title">Add New Skill</h2>
        <form id="skill-form"
              method="post"
              action="{% url 'main:create_skill' %}"
              class="experience-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="experience-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="skill-modal"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" id="skill-form-submit" class="button">Add Skill</button>
            </div>
        </form>
    </div>
</div>
